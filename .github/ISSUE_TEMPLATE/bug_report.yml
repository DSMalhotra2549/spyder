name: Bug report
description: Something in Spyder doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, don't open an issue: use **Security → Report a vulnerability** instead (see SECURITY.md).
        Spyder stores window titles and sites you visit, so check screenshots and logs for anything private before posting.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what Spyder did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Start with 15 min blocks
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Spyder version
      description: From the installer's file name, or `git rev-parse --short HEAD` if you built it from source.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
